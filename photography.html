<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photography — Ricky Dwi Abdul Azis</title>
  <meta name="description"
    content="Photography projects by Ricky Dwi Abdul Azis, with covers, descriptions and external links." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Photography — Ricky Dwi Abdul Azis" />
  <meta property="og:description"
    content="Photography projects by Ricky Dwi Abdul Azis, with covers, descriptions and external links." />
  <meta property="og:image" content="https://placehold.co/1200x630/1F2937/EBEBEB?text=Ricky+Dua" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Photography — Ricky Dwi Abdul Azis" />
  <meta name="twitter:description"
    content="Photography projects by Ricky Dwi Abdul Azis, with covers, descriptions and external links." />
  <!-- FAVICON PLACEHOLDER — replace href with your own icon -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231F2937'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
    :root {
      --primary: #EBEBEB;
      /* background (light) */
      --secondary: #1F2937;
      /* text (light) */
      --bg: var(--primary);
      --fg: var(--secondary);
      --muted: rgba(31, 41, 55, .65);
      --edge: rgba(31, 41, 55, .14);
      --shadow: 0 18px 40px rgba(31, 41, 55, .18);
      --pad: clamp(18px, 4vw, 48px);
      --font: 'Poppins', system-ui, sans-serif;
      --ease: cubic-bezier(.65, 0, .35, 1);
    }

    html[data-theme="dark"] {
      --bg: #1F2937;
      --fg: #EBEBEB;
      --muted: rgba(235, 235, 235, .65);
      --edge: rgba(235, 235, 235, .16);
      --shadow: 0 18px 40px rgba(0, 0, 0, .45);
    }

    /* ============================================================
   2. BASE
   ============================================================ */
    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-weight: 400;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: background .4s var(--ease), color .4s var(--ease);
    }

    h1,
    h2,
    h3,
    p {
      margin: 0
    }

    img {
      display: block;
      max-width: 100%
    }

    a {
      color: inherit;
      text-decoration: none
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer
    }

    :focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 4px;
      border-radius: 4px
    }

    /* ============================================================
   3. LOADING SCREEN
   ============================================================ */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: var(--bg);
      transition: opacity .6s var(--ease), visibility .6s;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden
    }

    #loader img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      animation: pulse 1.4s var(--ease) infinite
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: .45;
        transform: scale(.94)
      }

      50% {
        opacity: 1;
        transform: scale(1)
      }
    }

    /* ============================================================
   4. CUSTOM CURSOR
   ============================================================ */
    #cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      mix-blend-mode: difference;
      pointer-events: none;
      z-index: 9998;
      transform: translate3d(-50px, -50px, 0);
      transition: width .25s var(--ease), height .25s var(--ease);
      will-change: transform;
    }

    #cursor.grow {
      width: 56px;
      height: 56px
    }

    @media (hover:hover) and (pointer:fine) {
      body {
        cursor: none
      }
    }

    @media (hover:none) {
      #cursor {
        display: none
      }
    }

    /* ============================================================
   5. GLOBAL NAVIGATION
   ============================================================ */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 120;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: var(--pad);
      pointer-events: none;
    }

    .topbar>* {
      pointer-events: auto
    }

    .menu-btn {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 6px 2px
    }

    .menu-btn span {
      display: block;
      width: 22px;
      height: 2px;
      background: #fff;
      mix-blend-mode: difference;
      transition: transform .3s var(--ease), opacity .3s
    }

    .menu-btn[aria-expanded="true"] span:nth-child(1) {
      transform: translateY(7px) rotate(45deg)
    }

    .menu-btn[aria-expanded="true"] span:nth-child(2) {
      opacity: 0
    }

    .menu-btn[aria-expanded="true"] span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg)
    }

    .nav-panel {
      position: absolute;
      top: calc(var(--pad) + 34px);
      left: var(--pad);
      display: grid;
      gap: 2px;
      padding: 14px 22px 16px;
      border: 1px solid var(--edge);
      border-radius: 12px;
      background: var(--bg);
      box-shadow: var(--shadow);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: opacity .3s var(--ease), transform .3s var(--ease), visibility .3s;
    }

    .nav-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0)
    }

    .nav-panel a {
      font-size: 15px;
      padding: 5px 0;
      opacity: .8;
      white-space: nowrap
    }

    .nav-panel a:hover {
      opacity: 1;
      letter-spacing: .4px
    }

    .nav-panel a.active {
      opacity: 1;
      font-weight: 500
    }

    .nav-panel a.active::before {
      content: "—  ";
      opacity: .5
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px
    }

    #currentSection {
      font-size: 13px;
      letter-spacing: .2px;
      opacity: .85;
      white-space: nowrap
    }

    .theme-btn {
      font-size: 16px;
      line-height: 1;
      padding: 4px
    }

    /* ============================================================
   6. SECTION SHELL
   ============================================================ */
    .section {
      position: relative;
      min-height: 100svh;
      padding: calc(var(--pad) + 46px) var(--pad) var(--pad);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity .8s var(--ease), transform .8s var(--ease)
    }

    .reveal.in {
      opacity: 1;
      transform: none
    }

    /* ---- 6a. HOME ---- */
    #home {
      align-items: center;
      text-align: center;
      justify-content: center
    }

    .home-list {
      display: grid;
      gap: .15em
    }

    .home-list a {
      font-size: clamp(30px, 6.2vw, 64px);
      font-weight: 400;
      letter-spacing: -.02em;
      line-height: 1.25;
      transition: opacity .3s var(--ease), transform .3s var(--ease);
    }

    .home-list a:hover {
      opacity: .55;
      transform: translateY(-2px)
    }

    .deco {
      position: absolute;
      border-radius: 50%;
      background: var(--fg);
      opacity: .07;
      pointer-events: none;
      will-change: transform
    }

    .deco.d1 {
      width: 260px;
      height: 260px;
      top: 12%;
      left: 8%
    }

    .deco.d2 {
      width: 150px;
      height: 150px;
      bottom: 14%;
      right: 12%
    }

    .deco.d3 {
      width: 80px;
      height: 80px;
      bottom: 26%;
      left: 20%;
      border-radius: 0 40px 0 40px
    }

    /* ---- 6b. ABOUT ---- */
    #about {
      padding: 0;
      min-height: 100svh;
      overflow: hidden;
      justify-content: center
    }

    .about-wrap {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      width: 100%;
      min-height: 100svh
    }

    .portrait-side {
      position: relative;
      height: 100svh;
      overflow: hidden
    }

    .portrait-blob {
      position: absolute;
      top: 50%;
      left: 42%;
      translate: -50% -50%;
      width: min(78vh, 90%);
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--fg);
    }

    #portraitCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .about-text {
      position: relative;
      padding: 0 var(--pad);
      z-index: 1
    }

    .about-text .anim {
      display: block;
      transition: transform 1s var(--ease), opacity 1s var(--ease)
    }

    .hi {
      font-size: clamp(15px, 1.6vw, 20px);
      font-weight: 400
    }

    .name {
      font-size: clamp(38px, 6vw, 84px);
      font-weight: 500;
      letter-spacing: -.03em;
      line-height: 1.05
    }

    .fullname {
      font-size: clamp(11px, 1.1vw, 14px);
      font-weight: 300;
      opacity: .75;
      margin-top: 6px
    }

    .mark {
      width: clamp(40px, 4vw, 64px);
      aspect-ratio: 1;
      margin-top: 26px;
      background: var(--fg);
      -webkit-mask: radial-gradient(circle at 100% 0, transparent 52%, #000 53%);
      mask: radial-gradient(circle at 100% 0, transparent 52%, #000 53%);
    }

    .about-detail {
      min-height: auto;
      gap: 26px;
      justify-content: flex-start
    }

    .about-detail h2 {
      font-size: clamp(24px, 3.4vw, 40px);
      font-weight: 400;
      letter-spacing: -.02em
    }

    .about-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 26px;
      max-width: 980px
    }

    .about-grid h3 {
      font-size: 14px;
      font-weight: 500
    }

    .about-grid p {
      font-size: 12px;
      font-weight: 300;
      opacity: .7;
      line-height: 1.85;
      margin-top: 6px
    }

    /* ---- 6c. CATEGORY / PROJECT MARQUEES ---- */
    .cat-title {
      font-size: clamp(26px, 4vw, 44px);
      font-weight: 400;
      letter-spacing: -.02em
    }

    .cat-lead {
      max-width: 620px;
      font-size: 12px;
      font-weight: 300;
      opacity: .7;
      margin: 10px 0 18px
    }

    .category {
      min-height: 100svh;
      justify-content: center;
      gap: 22px
    }

    .marquee {
      overflow: hidden;
      width: 100%;
      -webkit-mask: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
      mask: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent)
    }

    .marquee-track {
      display: flex;
      gap: 18px;
      width: max-content;
      will-change: transform
    }

    .card {
      flex: 0 0 auto;
      width: clamp(150px, 20vw, 230px);
      border-radius: 6px;
      overflow: hidden;
      background: var(--edge);
      transition: transform .35s var(--ease), box-shadow .35s var(--ease);
    }

    .card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow)
    }

    .marquee:hover .marquee-track {
      animation-play-state: paused
    }

    /* ---- 6d. PROJECT DETAIL ---- */
    .detail {
      min-height: 100svh;
      justify-content: center;
      gap: 22px
    }

    .detail-hero {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: var(--shadow)
    }

    .detail-hero img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      transition: transform .5s var(--ease)
    }

    .detail-hero:hover img {
      transform: scale(1.03)
    }

    .detail h2 {
      font-size: clamp(28px, 4.4vw, 52px);
      font-weight: 400;
      letter-spacing: -.02em;
      margin-top: 10px
    }

    .detail p {
      max-width: 820px;
      font-size: clamp(11px, 1.05vw, 13px);
      font-weight: 300;
      opacity: .7;
      line-height: 1.85
    }

    .ext {
      font-size: 12px;
      text-decoration: underline;
      opacity: .8;
      width: max-content
    }

    /* ---- 6e. CONTACT ---- */
    #contact {
      justify-content: center;
      gap: clamp(40px, 8vh, 90px)
    }

    #contact h1 {
      font-size: clamp(28px, 5vw, 58px);
      font-weight: 400;
      letter-spacing: -.02em
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 34px 24px;
      max-width: 900px
    }

    .contact-grid h3 {
      font-size: 14px;
      font-weight: 400
    }

    .contact-grid a,
    .contact-grid span {
      display: block;
      font-size: 11px;
      font-weight: 300;
      opacity: .65;
      margin-top: 4px
    }

    .contact-grid a:hover {
      opacity: 1;
      text-decoration: underline
    }

    /* ---- 6f. FOOTER ---- */
    .site-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      padding: 22px var(--pad);
      border-top: 1px solid var(--edge);
      font-size: 11px;
      font-weight: 300;
      opacity: .7;
    }

    .site-footer a:hover {
      opacity: 1;
      text-decoration: underline
    }

    /* ============================================================
   7. RESPONSIVE
   ============================================================ */
    @media (max-width:900px) {
      .about-wrap {
        grid-template-columns: 1fr;
        min-height: auto;
        padding: calc(var(--pad) + 46px) var(--pad) var(--pad)
      }

      .portrait-side {
        height: 52svh;
        border-radius: 8px
      }

      .about-text {
        padding: 26px 0 0
      }

      .about-grid {
        grid-template-columns: 1fr 1fr
      }

      .contact-grid {
        grid-template-columns: 1fr 1fr
      }
    }

    @media (max-width:560px) {
      .about-grid {
        grid-template-columns: 1fr
      }

      .contact-grid {
        grid-template-columns: 1fr
      }

      .deco.d1 {
        width: 160px;
        height: 160px
      }

      #currentSection {
        font-size: 11px
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition-duration: .01ms !important
      }

      html {
        scroll-behavior: auto
      }
    }
  </style>
</head>

<body>
  <!-- ===== LOADING SCREEN ===== -->
  <div id="loader" role="status" aria-label="Loading">
    <img src="src/img/Logo color.webp" alt="Site logo" />
  </div>

  <!-- ===== CUSTOM CURSOR ===== -->
  <div id="cursor" aria-hidden="true"></div>

  <!-- ===== GLOBAL NAVIGATION ===== -->
  <header class="topbar">
    <div>
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="navPanel" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-panel" id="navPanel" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="graphic-design.html">Graphic Design</a>
        <a href="videography.html">Videography</a>
        <a href="photography.html" class="active" aria-current="page">Photography</a>
        <a href="motion-graphic.html">Motion Graphic</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
    <div class="topbar-right">
      <span id="currentSection" aria-live="polite">Photography</span>
      <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode">◐</button>
    </div>
  </header>

  <main>
    <!-- ===== PHOTOGRAPHY ===== -->
    <section class="section category" id="photography" data-label="Photography">
      <h1 class="cat-title reveal">Photography</h1>
      <p class="cat-lead reveal">Selected photography works. Hover a card to pause the row, click to jump to the
        project.</p>
      <div class="marquee">
        <div class="marquee-track" data-speed="34"></div>
      </div>
    </section>

    <!-- Project details for this category -->
    <div id="details"></div>

  </main>

  <footer class="site-footer">
    <span>© <span id="year"></span> Ricky Dwi Abdul Azis</span>
    <a href="contact.html">Get in touch →</a>
  </footer>

  <script>
    /* ============================================================
       A1. LOADING SCREEN
       ============================================================ */
    window.addEventListener('load', () => setTimeout(() => document.getElementById('loader').classList.add('hidden'), 1200));

    /* ============================================================
       A2. THEME (shared across pages via localStorage)
       ============================================================ */
    const root = document.documentElement;
    root.dataset.theme = localStorage.getItem('theme') || 'light';
    document.getElementById('themeBtn').addEventListener('click', () => {
      root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', root.dataset.theme);
    });

    /* ============================================================
       A3. CUSTOM CURSOR (rAF smoothing)
       ============================================================ */
    (() => {
      const dot = document.getElementById('cursor');
      let tx = 0, ty = 0, cx = 0, cy = 0, active = false;
      addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; active = true; }, { passive: true });
      const loop = () => {
        cx += (tx - cx) * .18; cy += (ty - cy) * .18;
        if (active) dot.style.transform = `translate3d(${cx - 11}px,${cy - 11}px,0)`;
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
      const CLICKABLE = 'a,button,.card,.detail-hero';
      addEventListener('mouseover', e => { if (e.target.closest(CLICKABLE)) dot.classList.add('grow'); });
      addEventListener('mouseout', e => { if (e.target.closest(CLICKABLE)) dot.classList.remove('grow'); });
    })();

    /* ============================================================
       A4. MENU PANEL
       ============================================================ */
    (() => {
      const btn = document.getElementById('menuBtn'), panel = document.getElementById('navPanel');
      const toggle = v => { panel.classList.toggle('open', v); btn.setAttribute('aria-expanded', v); };
      btn.addEventListener('click', () => toggle(!panel.classList.contains('open')));
      panel.addEventListener('click', e => { if (e.target.tagName === 'A') toggle(false); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') toggle(false); });
    })();

    /* ============================================================
       A5. SECTION LABEL + SCROLL REVEALS
       ============================================================ */
    const label = document.getElementById('currentSection');
    const sectionObserver = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting && en.intersectionRatio > .5) label.textContent = en.target.dataset.label; });
    }, { threshold: [.5, .75] });
    const revealObserver = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('in'); revealObserver.unobserve(e.target); }
    }), { threshold: .2 });
    function initReveals() {
      document.querySelectorAll('section[data-label]').forEach(s => sectionObserver.observe(s));
      document.querySelectorAll('.reveal:not(.in)').forEach(el => revealObserver.observe(el));
    }
    initReveals();

    /* ============================================================
       A6. FOOTER YEAR
       ============================================================ */
    document.getElementById('year').textContent = new Date().getFullYear();

    const PROJECTS = [
      { id: "street-series", title: "Street Series", url: "https://example.com/project-7" },
      { id: "portrait-series", title: "Portrait Series", url: "https://example.com/project-8" }
    ];

    /* ============================================================
       B. CATEGORY MARQUEE + PROJECT DETAILS (page-specific)
       ============================================================ */
    const LOREM = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.';
    const poster = (t, w, h) => `https://placehold.co/${w}x${h}/1F2937/EBEBEB?text=${encodeURIComponent(t)}`;

    (() => {
      document.querySelectorAll('.marquee-track').forEach(track => {
        const frag = document.createDocumentFragment();
        for (let rep = 0; rep < 3; rep++)PROJECTS.forEach(p => {
          const a = document.createElement('a');
          a.href = '#detail-' + p.id; a.className = 'card'; a.setAttribute('aria-label', p.title);
          a.innerHTML = `<img loading="lazy" src="${poster(p.title, 400, 600)}" alt="${p.title} project cover" />`;
          frag.appendChild(a);
        });
        track.appendChild(frag);
        const dur = (+track.dataset.speed || 40);
        track.animate(
          track.hasAttribute('data-reverse')
            ? [{ transform: 'translateX(-50%)' }, { transform: 'translateX(0)' }]
            : [{ transform: 'translateX(0)' }, { transform: 'translateX(-50%)' }],
          { duration: dur * 1000, iterations: Infinity, easing: 'linear' }
        );
      });
    })();

    (() => {
      const host = document.getElementById('details');
      host.innerHTML = PROJECTS.map(p => `
    <section class="section detail" id="detail-${p.id}" data-label="${p.title}">
      <a class="detail-hero reveal" href="${p.url}" target="_blank" rel="noopener" aria-label="Open ${p.title} in a new tab">
        <img loading="lazy" src="${poster(p.title, 1200, 675)}" alt="${p.title} preview" />
      </a>
      <h2 class="reveal">${p.title}</h2>
      <p class="reveal">${LOREM}</p>
      <a class="ext reveal" href="${p.url}" target="_blank" rel="noopener">View external link →</a>
    </section>`).join('');
      initReveals();
    })();

  </script>
</body>

</html>
